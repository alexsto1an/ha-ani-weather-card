name: Bug report
description: Something on either card doesn't work, or doesn't look right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting it. The more of this you fill in, the sooner it's fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The steps, and the condition and time of day if they matter.
      placeholder: |
        1. Rain at dusk
        2. Switch to another tab and back
        3. Some raindrops stay still at the top of the card
  - type: input
    id: card-version
    attributes:
      label: Card version
      description: The Marketplace shows it, and so does the card's banner in the browser console.
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or app
      description: Where you see it, and on what device.
      placeholder: Chrome 142 on Windows, the Companion app on an iPhone, Fully Kiosk on a Fire tablet
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: The card's YAML
      description: In the card's editor, select ⋮ → Edit in YAML, and paste it here.
      render: yaml
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: Drag it in here. For something that moves, a short recording says the most.
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: In the browser's developer tools, open the Console and copy any lines that mention the card.
      render: text
