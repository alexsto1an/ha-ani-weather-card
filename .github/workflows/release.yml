name: Release

# Triggered by pushing a `vX.Y.Z` tag. Builds the five bundles and publishes
# a GitHub Release with them attached. HACS reads hacs.json at the tag, finds
# its `filename` (animated-weather-card.js) among the release's files,
# registers it as the dashboard resource and downloads every attached file,
# so the release carries exactly the five bundles and nothing else. (With
# `zip_release`, HACS would download the file `filename` names and unzip it,
# which is what broke 1.0.0.)
#
# To cut a release:
#   1. Set the version in package.json and in CARD_VERSION (src/constants.ts)
#      so they match (this workflow rejects a mismatch).
#   2. Commit them with the rebuilt bundles.
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#   The workflow takes it from there.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version consistency
        # HACS shows the release tag as the version. The card logs
        # CARD_VERSION in the browser console, and package.json carries it
        # too, so all three must agree before anything is published.
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          CARD=$(grep -E "^export const CARD_VERSION" src/constants.ts | sed -E "s/.*'([^']+)'.*/\1/")
          echo "Tag:           $TAG"
          echo "package.json:  $PKG"
          echo "CARD_VERSION:  $CARD"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARD" ]; then
            echo "::error::Version mismatch — set package.json and CARD_VERSION to match the tag before pushing."
            exit 1
          fi

      - name: Build bundles
        run: npm run build

      - name: Verify all bundles were produced
        run: |
          test -f animated-weather-card.js
          test -f animated-weather-card-editor.js
          test -f animated-weather-card-dev.js
          test -f animated-weather-card-note.js
          test -f animated-weather-card-planes.js
          echo "Main bundle:   $(stat -c %s animated-weather-card.js) bytes"
          echo "Editor bundle: $(stat -c %s animated-weather-card-editor.js) bytes"
          echo "Dev bundle:    $(stat -c %s animated-weather-card-dev.js) bytes"
          echo "Note bundle:   $(stat -c %s animated-weather-card-note.js) bytes"
          echo "Planes bundle: $(stat -c %s animated-weather-card-planes.js) bytes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            animated-weather-card.js
            animated-weather-card-editor.js
            animated-weather-card-dev.js
            animated-weather-card-note.js
            animated-weather-card-planes.js
